<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de Equipamentos</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="appRoot">
  <!-- CABEÇALHO SUPERIOR (apenas no mobile; em desktop fica discreto) -->
  <header class="topbar no-print">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Checklist de Equipamentos</span>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="Alternar tema claro/escuro" title="Tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79"/></svg>
    </button>
    <span id="syncBadge" class="sync-badge" title="Sincronização"></span>
  </header>

  <!-- ABA CHECKLIST -->
  <section id="tab-checklist" class="panel active">
    <div class="card ident">
      <label>Nome do instrutor(a)<input id="inInstrutor" type="text" placeholder="Seu nome" autocomplete="name"></label>
      <label>Escola<input id="inEscola" type="text" placeholder="Nome da escola"></label>
      <label>Turno
        <select id="inTurno">
          <option>Manhã</option><option>Tarde</option><option>Integral</option>
        </select>
      </label>
      <label class="declarante"><input type="checkbox" id="inDeclarante" checked> Declaro que conferi os itens e me responsabilizo pelas informações.</label>
    </div>

    <div class="row-between">
      <div id="progress" class="progress-text">0 de 0 conferidos</div>
      <button id="btnManage" class="btn ghost">Gerenciar equipamentos</button>
    </div>

    <div id="items" class="items"></div>

    <div class="card">
      <label for="inNotes"><strong>Observações</strong></label>
      <textarea id="inNotes" rows="4" placeholder="Avarias, itens em manutenção, patrimônios faltantes…"></textarea>
    </div>

    <div class="actions">
      <button id="btnFinish" class="btn primary big">Finalizar checklist e gerar laudo</button>
      <button id="btnReset" class="btn danger">Resetar contagem</button>
    </div>
  </section>

  <!-- ABA HISTÓRICO -->
  <section id="tab-history" class="panel">
    <div class="card filters">
      <label>Data<input id="fDate" type="date"></label>
      <label>Status
        <select id="fStatus">
          <option value="all">Todos</option>
          <option value="div">Com divergência</option>
          <option value="ok">Sem divergência</option>
        </select>
      </label>
      <button id="btnClearFilter" class="btn ghost">Limpar filtros</button>
    </div>
    <div id="historyList" class="history"></div>
  </section>

  <!-- ABA BACKUP -->
  <section id="tab-data" class="panel">
    <div class="card">
      <h2>Backup</h2>
      <p>Exporta um arquivo .json com equipamentos, laudos e preferências.</p>
      <button id="btnExport" class="btn primary">Exportar backup</button>
    </div>
    <div class="card">
      <h2>Restaurar backup</h2>
      <p>Substitui os dados atuais pelos do arquivo selecionado.</p>
      <input id="fileImport" type="file" accept=".json,application/json" hidden>
      <button id="btnImport" class="btn">Importar backup</button>
    </div>
    <div class="card" id="storageInfo"></div>
    <div class="card firebase-status">
      <h2>Nuvem (Firebase)</h2>
      <p id="firebaseMsg">Configurando…</p>
      <button id="btnSyncNow" class="btn">Sincronizar agora</button>
    </div>
  </section>
</main>

<!-- NAVEGAÇÃO INFERIOR (mobile) -->
<nav class="bottom-nav no-print" role="tablist" aria-label="Navegação principal">
  <button class="nav-item active" data-tab="checklist" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <span>Checklist</span>
  </button>
  <button class="nav-item" data-tab="history" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7H3m5 10V3m6 13h-3M3 17h9M13 3h7l2 3"/></svg>
    <span>Histórico</span>
  </button>
  <button class="nav-item" data-tab="data" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>Backup</span>
  </button>
</nav>

<!-- MODAL: RELATÓRIO (LAUDO) -->
<dialog id="reportModal" class="no-print">
  <div class="modal-head"><h2>Laudo de Conferência</h2><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
  <div id="reportView" class="report"></div>
  <div class="actions row">
    <button id="btnCopy" class="btn primary">Copiar WhatsApp</button>
    <button id="btnPdf" class="btn">Gerar PDF</button>
    <button id="btnPrint" class="btn">Imprimir</button>
  </div>
</dialog>

<!-- BOTTOM SHEET: GERENCIAR EQUIPAMENTOS -->
<div id="manageSheet" class="bottom-sheet no-print" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3 id="sheetTitle">Gerenciar equipamentos</h3>
    <button class="icon-btn" data-close aria-label="Fechar">✕</button>
  </div>
  <div id="manageList" class="manage-list"></div>
  <form id="addForm" class="add-form">
    <input id="newName" type="text" placeholder="Novo equipamento" required>
    <input id="newQty" type="number" min="0" value="1" required aria-label="Quantidade prevista">
    <button class="btn primary" type="submit">Adicionar</button>
  </form>
</div>
<div id="sheetBackdrop" class="sheet-backdrop no-print"></div>

<div id="printArea" class="print-only report"></div>
<div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
